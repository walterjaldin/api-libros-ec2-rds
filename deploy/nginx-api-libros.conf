# /etc/nginx/sites-available/api-libros
# Nginx publica la API y la reenvia al contenedor en 127.0.0.1:3000.
# Los puertos 3000 (Node.js) y 3306 (MySQL) NO estan abiertos en los Security Groups.

# HTTPS con certificado de Let's Encrypt (certbot --nginx) para el nombre sslip.io
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3-219-43-118.sslip.io;

    ssl_certificate /etc/letsencrypt/live/3-219-43-118.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-219-43-118.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP del nombre de dominio -> redireccion a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 3-219-43-118.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTP por IP (Elastic IP): se mantiene para acceso directo y para el smoke test
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
