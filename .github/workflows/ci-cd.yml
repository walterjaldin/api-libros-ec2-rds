name: CI/CD - API Libros

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # cambios solo de documentacion no redespliegan
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------- CI ----------------
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Pruebas unitarias + integración (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: db_libros
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_pw"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUN_INTEGRATION: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_pw
      DB_NAME: db_libros
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas con cobertura (umbral 80%)
        run: npm run test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          echo "### Cobertura de pruebas" >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log('- **'+k+'**: '+c[k].pct+'%')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  # ---------------- CD ----------------
  build-and-push:
    name: Build imagen Docker + escaneo + push (GHCR)
    needs: [lint, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Leer versión de package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build (multi-stage, ejecuta lint y tests dentro) y push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:v${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de vulnerabilidades (Grype)
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: table
      - name: Publicar resultado del escaneo
        if: always()
        run: |
          echo "### Escaneo de vulnerabilidades (Grype)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.scan.outputs.table }}" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Sin hallazgos" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy en EC2 (production)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}/health
    permissions:
      contents: read
      packages: read
    steps:
      - name: Desplegar por SSH con health check
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            NAME=api-libros
            ENV_FILE=/opt/api-libros/.env
            test -f "$ENV_FILE" || { echo "Falta $ENV_FILE con las credenciales de RDS"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            # 1) Levantar la nueva version en un puerto alterno solo local (3001)
            docker pull "$IMAGE_REF"
            docker rm -f "$NAME-new" >/dev/null 2>&1 || true
            docker run -d --name "$NAME-new" --env-file "$ENV_FILE" -p 127.0.0.1:3001:3000 "$IMAGE_REF"
            # 2) Health check (incluye la conexion a RDS)
            echo "Esperando health check de la nueva version..."
            ok=0
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3001/health; then ok=1; break; fi
              sleep 3
            done
            echo
            if [ "$ok" != 1 ]; then
              echo "Health check FALLIDO: se mantiene la version anterior."
              docker logs --tail 30 "$NAME-new" || true
              docker rm -f "$NAME-new" || true
              exit 1
            fi
            # 3) Reemplazar el contenedor activo (Nginx apunta a 127.0.0.1:3000)
            echo "Health check OK. Activando nueva version..."
            docker rm -f "$NAME-new"
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker run -d --name "$NAME" --restart unless-stopped --env-file "$ENV_FILE" \
              -p 127.0.0.1:3000:3000 "$IMAGE_REF"
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1/health; then echo; echo "Despliegue completado: $IMAGE_REF"; break; fi
              sleep 2
            done
            docker image prune -f >/dev/null
            docker ps --filter "name=$NAME"

  smoke-test:
    name: Smoke test contra la URL pública
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verificar versión desplegada y CRUD sobre RDS
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          health=$(curl -sf "$API_URL/health")
          echo "$health"
          echo "$health" | jq -e --arg sha "$GITHUB_SHA" '.status=="ok" and .database=="up" and .commit==$sha'
          id=$(curl -sf -X POST "$API_URL/libros" -H 'Content-Type: application/json' \
               -d "{\"titulo\":\"Smoke test ${GITHUB_RUN_ID}\",\"autor\":\"GitHub Actions\"}" | jq -r .id)
          echo "Libro creado con id=$id"
          curl -sf "$API_URL/libros/$id" | jq .
          curl -sf -X PATCH "$API_URL/libros/$id" -H 'Content-Type: application/json' -d '{"disponible":false}' | jq -e '.disponible==false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$API_URL/libros/$id")" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/libros/$id")" = 404
          echo "Smoke test OK"
