name: Rollback manual

# Restaura una imagen anterior (tag = SHA del commit) con la misma verificación del CD.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de imagen a restaurar (SHA de un commit anterior o vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Credenciales temporales de AWS (OIDC, sin claves guardadas)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Abrir SSH (22) solo para la IP de este runner
        id: sg
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress --group-id "${{ vars.EC2_SG_ID }}" --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-temporal}]" >/dev/null
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Regla temporal agregada: 22/tcp desde $ip/32"

      - name: Restaurar versión en EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            NAME=api-libros
            ENV_FILE=/opt/api-libros/.env   # configuracion de RDS: solo en la EC2, fuera del repo y de la imagen
            test -f "$ENV_FILE" || { echo "Falta $ENV_FILE con las credenciales de RDS"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            verificar() {  # $1 = URL base. Comprueba /health y una consulta a /libros
              curl -sf "$1/health" && echo && curl -sf -o /dev/null "$1/libros?limit=1" && echo "GET /libros OK"
            }

            PREV=$(docker inspect -f '{{.Config.Image}}' "$NAME" 2>/dev/null || true)
            echo "Version activa antes del despliegue: ${PREV:-ninguna}"

            # 1) Levantar la nueva version en un puerto alterno solo local (3001)
            EXTRA=""
            if [ "$SIMULAR_FALLO" = "true" ]; then
              echo "*** SIMULACION DE FALLO: la nueva version recibe un DB_HOST invalido ***"
              EXTRA="-e DB_HOST=bd-inexistente.invalid"
            fi
            docker pull "$IMAGE_REF"
            docker rm -f "$NAME-new" >/dev/null 2>&1 || true
            docker run -d --name "$NAME-new" --env-file "$ENV_FILE" $EXTRA -p 127.0.0.1:3001:3000 "$IMAGE_REF"

            # 2) Verificar la nueva version ANTES de exponerla
            echo "Verificando la nueva version (/health y /libros)..."
            ok=0
            for i in $(seq 1 20); do
              if verificar http://127.0.0.1:3001; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "Verificacion FALLIDA: se conserva la version anterior (${PREV:-ninguna})."
              docker logs --tail 15 "$NAME-new" || true
              docker rm -f "$NAME-new" || true
              exit 1
            fi

            # 3) Reemplazar el contenedor activo (Nginx :80 -> 127.0.0.1:3000; el 3000 no se expone)
            echo "Verificacion OK. Activando nueva version..."
            docker rm -f "$NAME-new"
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker run -d --name "$NAME" --restart unless-stopped --env-file "$ENV_FILE" \
              -p 127.0.0.1:3000:3000 "$IMAGE_REF"

            # 4) Verificar a traves de Nginx; si falla, restaurar la version anterior
            ok=0
            for i in $(seq 1 20); do
              if verificar http://127.0.0.1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "La nueva version no responde por Nginx. Restaurando ${PREV}..."
              docker rm -f "$NAME" || true
              [ -n "$PREV" ] && docker run -d --name "$NAME" --restart unless-stopped --env-file "$ENV_FILE" -p 127.0.0.1:3000:3000 "$PREV"
              exit 1
            fi
            echo "Despliegue completado: $IMAGE_REF"
            docker image prune -f >/dev/null
            docker ps --filter "name=$NAME"

      - name: Cerrar SSH para el runner (siempre, aunque falle el despliegue)
        if: always() && steps.sg.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ vars.EC2_SG_ID }}" --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.sg.outputs.ip }}/32}]" >/dev/null
          echo "Regla temporal eliminada: 22/tcp desde ${{ steps.sg.outputs.ip }}/32"
